# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - student-mgmt-be

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_student-mgmt-be.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        working-directory: ./backend      # ← run npm install in /backend, not repo root
        run: npm install --omit=dev       # --omit=dev skips jest/supertest (not needed in prod)

      - name: Run tests
        working-directory: ./backend
        run: npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend                 # ← upload only /backend, not the entire repo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D87F6BB0C818475994FC8FF165F86687 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B3CD6E0A3DA34DCC9EAEDC9FBA9C64A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C842117235A845508A30253CBFA329F4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'student-mgmt-be'
          slot-name: 'Production'
          package: .                      # artifact was downloaded to current dir